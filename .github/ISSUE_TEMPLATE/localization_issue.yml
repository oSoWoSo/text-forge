name: Localization Issue
description: Report a problem or improvement in Text Forge translations
labels: ["triage"]
projects: ["text-forge/1"]
type: localization
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping us improve our translations!
        Please fill out the fields below to make your report clear and actionable.
  - type: markdown
    attributes:
      value: |
        ## 0/3 Before starting, check:
  - type: checkboxes
    attributes:
      label: Is there an existing issue for this?
      description: Please search to see if an issue already exists for the localization problem you encountered.
      options:
        - label: I have searched the existing issues
          required: true
    validations:
      required: true
  - type: markdown
    attributes:
      value: |
        ## 1/3 Problem description
  - type: dropdown
    attributes:
      label: Language affected
      description: Which language has the problem?
      options:
        - English
        - Persian
        - Polish
        - Other
    validations:
      required: true
  - type: textarea
    attributes:
      label: Problem
      description: Describe the translation issue clearly (missing, incorrect, unclear, inconsistent).
      placeholder: |
        Example: In Persian, the word for "Save" is mistranslated as "Keep".
    validations:
      required: true
  - type: markdown
    attributes:
      value: |
        ## 2/3 Suggested fix
  - type: textarea
    attributes:
      label: Suggested translation
      description: Provide the correct translation or improvement.
      placeholder: |
        Example: "Save" should be translated as "ذخیره".
    validations:
      required: false
  - type: input
    attributes:
      label: Context link
      description: Provide the link to the documentation or UI page where this translation appears.
      placeholder: |
        Example: https://text-forge.github.io/docs/editor/settings
    validations:
      required: false
  - type: textarea
    attributes:
      label: Additional context
      description: Add any other context, screenshots, or references to help explain the issue.
    validations:
      required: false
  - type: markdown
    attributes:
      value: |
        ## 3/3 Final review
  - type: checkboxes
    attributes:
      label: Code of Conduct
      description: By submitting this issue, you agree to follow our [Code of Conduct](https://github.com/text-forge/text-forge/blob/Main/CODE_OF_CONDUCT.md).
      options:
        - label: I agree to follow this project's Code of Conduct
          required: true
    validations:
      required: true
