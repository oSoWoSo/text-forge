name: Documentation Issue
description: Report a problem or improvement in Text Forge documentation
labels: ["triage"]
projects: ["text-forge/1"]
type: documentation
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping us improve our documentation!
        Please fill out the fields below to make your report clear and actionable.
  - type: markdown
    attributes:
      value: |
        ## 0/3 Before starting, check:
  - type: checkboxes
    attributes:
      label: Is there an existing issue for this?
      description: Please search to see if an issue already exists for the documentation problem you encountered.
      options:
        - label: I have searched the existing issues
          required: true
  - type: markdown
    attributes:
      value: |
        ## 1/3 Problem description
  - type: input
    attributes:
      label: Section or page link
      description: Provide the direct link to the documentation page where the issue exists.
      placeholder: |
        Example: https://text-forge.github.io/docs/installation/linux
    validations:
      required: true
  - type: textarea
    attributes:
      label: Problem
      description: Describe the issue clearly (missing info, outdated, unclear, incorrect).
      placeholder: |
        Example: The Linux installation steps are outdated and don’t match the current build process.
    validations:
      required: true
  - type: markdown
    attributes:
      value: |
        ## 2/3 Suggested fix
  - type: textarea
    attributes:
      label: Suggested improvement
      description: Provide a clear suggestion for how the documentation should be updated.
      placeholder: |
        Example: Update Linux installation steps to include new dependency requirements.
    validations:
      required: false
  - type: textarea
    attributes:
      label: Additional context
      description: Add any other context, screenshots, or references to help explain the issue.
    validations:
      required: false
  - type: markdown
    attributes:
      value: |
        ## 3/3 Final review
  - type: checkboxes
    attributes:
      label: Code of Conduct
      description: By submitting this issue, you agree to follow our [Code of Conduct](https://github.com/text-forge/text-forge/blob/Main/CODE_OF_CONDUCT.md).
      options:
        - label: I agree to follow this project's Code of Conduct
          required: true
