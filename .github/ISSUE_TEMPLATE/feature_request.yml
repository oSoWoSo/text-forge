name: Feature Request
description: Suggest an idea for Text Forge
labels: ["triage"]
projects: ["text-forge/1"]
type: feature
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to suggest a new feature!
        Please fill out all relevant fields to help us evaluate your idea.
  - type: markdown
    attributes:
      value: |
        ## 0/3 Before starting, check:
  - type: checkboxes
    attributes:
      label: Is there an existing issue for this?
      description: Please search to see if an issue already exists for the feature you’re suggesting.
      options:
        - label: I have searched the existing issues
          required: true
  - type: markdown
    attributes:
      value: |
        ## 1/3 Motivation
  - type: textarea
    attributes:
      label: Why is this feature needed?
      description: Explain the problem or limitation that this feature would solve.
      placeholder: |
        Example: Current workflow requires too many manual steps...
    validations:
      required: true
  - type: markdown
    attributes:
      value: |
        ## 2/3 Proposal
  - type: textarea
    attributes:
      label: Feature description
      description: A clear and concise description of the feature you’d like to see.
      placeholder: |
        Example: Add a command to auto-generate documentation from code comments.
    validations:
      required: true
  - type: textarea
    attributes:
      label: Alternatives considered
      description: Describe any alternative solutions or workarounds you’ve thought about.
      placeholder: |
        Example: I tried using external scripts but they don’t integrate well.
    validations:
      required: false
  - type: textarea
    attributes:
      label: Additional context
      description: Add any other context, screenshots, or references to help explain your idea.
    validations:
      required: false
  - type: markdown
    attributes:
      value: |
        ## 3/3 Final review
  - type: checkboxes
    attributes:
      label: Code of Conduct
      description: By submitting this issue, you agree to follow our [Code of Conduct](https://github.com/text-forge/text-forge/blob/Main/CODE_OF_CONDUCT.md).
      options:
        - label: I agree to follow this project's Code of Conduct
          required: true
